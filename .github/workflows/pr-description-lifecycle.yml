name: PR description lifecycle

on:
  pull_request:
    types: [closed]

# This job only signals a delivered close/merge event. It reads no PR code,
# checks out nothing, installs nothing, and has no repository permissions.
permissions: {}

jobs:
  pr-description-lifecycle:
    name: pr-description-lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Observe PR closure
        run: "true"
