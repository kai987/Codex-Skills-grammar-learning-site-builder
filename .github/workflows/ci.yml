name: PR cleanup acceptance

on:
  workflow_dispatch:

permissions: {}

jobs:
  close-test-pr:
    if: github.ref == 'refs/heads/codex/test-token-closure-reconcile'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Close only the temporary acceptance PR using GITHUB_TOKEN
        run: gh api --method PATCH repos/kai987/Codex-Skills-grammar-learning-site-builder/pulls/17 -f state=closed --jq '{number,state,merged}'
        env:
          GH_TOKEN: ${{ github.token }}
