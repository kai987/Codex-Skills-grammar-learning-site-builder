name: PR description label recheck

on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  # This is deliberately separate from the required pr-description check.
  # Skipping an unrelated label/bot event must not replace a required failure.
  # Reads can run independently: a skipped event must not cancel a real check.
  pr-description-label-recheck:
    name: pr-description-label-recheck
    if: >-
      github.event.label.name == 'needs-description' &&
      github.event.sender.type == 'User' &&
      !endsWith(github.event.sender.login, '[bot]') &&
      !endsWith(github.triggering_actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository with read-only permissions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Revalidate current PR description
        run: node scripts/check-pr-description.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
